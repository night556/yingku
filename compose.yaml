services:
  yingku:
    build:
      context: .
      dockerfile: Dockerfile
    image: yingku:local
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      YINGKU_ADDR: 0.0.0.0:8787
      YINGKU_DATA_DIR: ${YINGKU_DATA_DIR:-/config}
      YINGKU_MEDIA_DIR: ${YINGKU_MEDIA_DIR:-/media}
      YINGKU_PUBLIC_URL: ${YINGKU_PUBLIC_URL:-}
      YINGKU_BAIDU_CLIENT_ID: ${YINGKU_BAIDU_CLIENT_ID:-}
      YINGKU_BAIDU_CLIENT_SECRET: ${YINGKU_BAIDU_CLIENT_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${YINGKU_BIND_IP:-0.0.0.0}:${YINGKU_HOST_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: ${YINGKU_CONFIG_PATH:-../files/yingku/config}
        target: ${YINGKU_DATA_DIR:-/config}
      - type: bind
        source: ${YINGKU_MEDIA_PATH:-../files/yingku/media}
        target: ${YINGKU_MEDIA_DIR:-/media}

# /media can contain both existing films and new downloads.
# Optional: add a separate read-only mount to the existing yingku.volumes list:
#       - /mnt/nas/videos:/imports:ro

# To use only a Dokploy domain, remove ports above and add expose: ["8787"].
# Dokploy Domains: service yingku, container port 8787, path /.
# Keep one instance; the JSON library is not shared across replicas.
