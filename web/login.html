<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录映库</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.svg"><script type="module" src="/login.js"></script></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-symbol">映</span><span>映库<small>YINGKU</small></span></a><h1>打开你的映库</h1><p>输入在电脑上设置的手机访问密码。</p><form id="login-form"><label class="field"><span>访问密码</span><input type="password" name="password" autocomplete="current-password" required maxlength="128" autofocus></label><div id="login-error" role="status"></div><button class="button primary" type="submit">进入媒体库</button></form><p class="section-note">忘记密码？在运行映库的电脑上打开设置，重新设置即可。</p></main></body>
</html>
